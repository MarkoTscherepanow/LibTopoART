# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build library

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build and pack
      working-directory: ./src
      run: dotnet pack --configuration Release -p:EmbedUntrackedSources=true -p:ContinuousIntegrationBuild=true -p:PublishRepositoryUrl=true -p:ReleaseBuild=true LibTopoART.csproj

    - uses: actions/upload-artifact@v4
      with:
        name: NuGetPackage
        path: /home/runner/work/LibTopoART/LibTopoART/src/bin/Release/LibTopoART.1.*.?.nupkg
